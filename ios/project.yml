name: hex-ios-keyboard
options:
  bundleIdPrefix: com.niraj
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Set your Apple ID team here (or in Xcode → Signing & Capabilities).
    DEVELOPMENT_TEAM: TA2H8548F2
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    APP_GROUP_ID: group.com.niraj.voicekeyboard

targets:
  VoiceKeyboard:
    type: application
    platform: iOS
    sources:
      - VoiceKeyboard
      - Shared
    dependencies:
      - target: Keyboard
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niraj.voicekeyboard
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: VoiceKeyboard/Info.plist
      properties:
        CFBundleDisplayName: hex-ios-keyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: hex-ios-keyboard records your voice while you hold the mic button, and sends it to your Mac for transcription.
        NSLocalNetworkUsageDescription: hex-ios-keyboard sends your recordings to the transcription server running on your Mac.
        NSBonjourServices: [_voicekb._tcp]
        AppGroupID: $(APP_GROUP_ID)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.niraj.voicekeyboard
            CFBundleURLSchemes: [voicekb]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: VoiceKeyboard/VoiceKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]

  Keyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niraj.voicekeyboard.keyboard
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: hex-ios-keyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
